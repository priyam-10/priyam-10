<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="620"
     viewBox="0 0 1200 620">

  <defs>

    <!-- Background -->
    <linearGradient id="bg"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0B1024"/>
      <stop offset="100%" stop-color="#160B2B"/>
    </linearGradient>

    <!-- Blue / purple accent -->
    <linearGradient id="accent"
                    x1="0" y1="0"
                    x2="1" y2="0">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <!-- Grid -->
    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"
            fill="none"
            stroke="#64748B"
            stroke-opacity="0.10"/>
    </pattern>

    <!-- Photo circle -->
    <clipPath id="photoClip">
      <circle cx="930"
              cy="235"
              r="105"/>
    </clipPath>

  </defs>


  <!-- ================= BACKGROUND ================= -->

  <rect width="1200"
        height="620"
        rx="30"
        fill="url(#bg)"/>

  <rect width="1200"
        height="620"
        rx="30"
        fill="url(#grid)"/>


  <!-- Background glow -->

  <circle cx="1050"
          cy="100"
          r="170"
          fill="#7C3AED"
          opacity="0.13"
          filter="url(#glow)"/>

  <circle cx="150"
          cy="560"
          r="170"
          fill="#2563EB"
          opacity="0.10"
          filter="url(#glow)"/>


  <!-- Border -->

  <rect x="25"
        y="25"
        width="1150"
        height="570"
        rx="25"
        fill="none"
        stroke="#64748B"
        stroke-opacity="0.35"/>


  <!-- ================= HEADER ================= -->

  <text x="70"
        y="75"
        fill="#7EA7FF"
        font-family="monospace"
        font-size="15"
        font-weight="700"
        letter-spacing="3">
    01 / BUILDER PROFILE
  </text>


  <!-- ================= MAIN TITLE ================= -->

  <text x="70"
        y="155"
        fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="58"
        font-weight="800">
    REAL DATA.
  </text>

  <text x="70"
        y="218"
        fill="#A855F7"
        font-family="Arial, Helvetica, sans-serif"
        font-size="58"
        font-weight="800">
    REAL INSIGHTS.
  </text>


  <!-- Accent line -->

  <rect x="72"
        y="245"
        width="470"
        height="4"
        rx="2"
        fill="url(#accent)"/>


  <!-- Subtitle -->

  <text x="70"
        y="285"
        fill="#D1D5DB"
        font-family="monospace"
        font-size="19"
        font-weight="600">
    DATA • AI/ML • DATA SCIENCE
  </text>

  <text x="70"
        y="316"
        fill="#7F8BA8"
        font-family="monospace"
        font-size="14">
    CSE UNDERGRADUATE / DATA BUILDER
  </text>


  <!-- ================= FOCUS CARD ================= -->

  <rect x="70"
        y="350"
        width="525"
        height="82"
        rx="16"
        fill="#FFFFFF"
        fill-opacity="0.045"
        stroke="#64748B"
        stroke-opacity="0.30"/>

  <text x="95"
        y="380"
        fill="#7EA7FF"
        font-family="monospace"
        font-size="12"
        font-weight="700">
    CURRENT FOCUS
  </text>

  <text x="95"
        y="408"
        fill="#F8FAFC"
        font-family="monospace"
        font-size="16">
    Analytics · Machine Learning · GenAI
  </text>


  <!-- ================= NAME ================= -->

  <text x="70"
        y="490"
        fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="29"
        font-weight="800">
    PRIYAM SINGH
  </text>

  <text x="70"
        y="518"
        fill="#7F8BA8"
        font-family="monospace"
        font-size="13">
    BUILDING PROJECTS • LEARNING BY DOING
  </text>


  <!-- ================= PROFILE PHOTO ================= -->

  <!-- Outer ring -->

  <circle cx="930"
          cy="235"
          r="120"
          fill="none"
          stroke="#4F8CFF"
          stroke-opacity="0.25"
          stroke-width="2"/>

  <circle cx="930"
          cy="235"
          r="112"
          fill="#111827"
          stroke="url(#accent)"
          stroke-width="4"/>


  <!-- YOUR PHOTO -->

  <image
      href="https://raw.githubusercontent.com/priyam-10/priyam-10/main/assets/priyam.png"
      x="825"
      y="130"
      width="210"
      height="210"
      preserveAspectRatio="xMidYMid slice"
      clip-path="url(#photoClip)"
  />


  <!-- Photo inner border -->

  <circle cx="930"
          cy="235"
          r="105"
          fill="none"
          stroke="#FFFFFF"
          stroke-opacity="0.15"
          stroke-width="2"/>


  <!-- ================= TOOLKIT CARD ================= -->

  <rect x="765"
        y="380"
        width="330"
        height="125"
        rx="18"
        fill="#FFFFFF"
        fill-opacity="0.045"
        stroke="#64748B"
        stroke-opacity="0.30"/>

  <text x="790"
        y="412"
        fill="#7EA7FF"
        font-family="monospace"
        font-size="12"
        font-weight="700">
    CORE TOOLKIT
  </text>

  <text x="790"
        y="442"
        fill="#F8FAFC"
        font-family="monospace"
        font-size="16">
    Python · SQL · Pandas
  </text>

  <text x="790"
        y="470"
        fill="#F8FAFC"
        font-family="monospace"
        font-size="16">
    ML · Power BI · GenAI
  </text>


  <!-- ================= FOOTER ================= -->

  <text x="1120"
        y="555"
        text-anchor="end"
        fill="#56627D"
        font-family="monospace"
        font-size="11">
    DATA → INSIGHTS → APPLICATIONS
  </text>


     
</svg>
